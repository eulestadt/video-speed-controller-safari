<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Video Speed Controller">
  <title>Video Speed Controller</title>
  <defs>
    <!-- Classic videospeed red: bright top → deep crimson -->
    <linearGradient id="redFace" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="55%" stop-color="#E62117"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <linearGradient id="chevFade" x1="220" y1="256" x2="430" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed red field -->
  <rect width="512" height="512" rx="112" fill="url(#redFace)"/>

  <!-- Play -->
  <path fill="#FFFFFF" d="M152 168v152l118-76z"/>

  <!-- Speed chevrons fading right -->
  <g fill="url(#chevFade)">
    <path d="M268 176l64 66-64 66h36l64-66-64-66z"/>
    <path d="M324 176l64 66-64 66h36l64-66-64-66z"/>
    <path d="M380 176l64 66-64 66h36l64-66-64-66z"/>
  </g>

  <!-- Speed track + high-rate thumb -->
  <rect x="150" y="368" width="212" height="16" rx="8" fill="#FFFFFF" opacity="0.92"/>
  <rect x="300" y="358" width="34" height="36" rx="8" fill="#FFFFFF"/>
</svg>
